[package]
name = "foliage"
version = "1.0.0"
edition = "2024"
description = "Cross-platform, ECS-backed UI -- native, web, and Android from one Rust codebase."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eblack-leaf/foliage"
homepage = "https://eblack-leaf.github.io/foliage/"
documentation = "https://eblack-leaf.github.io/foliage/book/"

[dependencies]
foliage_proper = { path = "../foliage_proper", default-features = false }
foliage_macros = { path = "../foliage_macros" }

[features]
default = ["remote-assets"]
# Passthrough for foliage_proper's on-by-default native URL asset loading. Kept in the
# default set so the facade matches foliage_proper's own default; a dependent that only
# loads bundled `Bytes` assets can turn it off here to shed reqwest/rustls.
remote-assets = ["foliage_proper/remote-assets"]
# Passthrough for foliage_proper's off-by-default arrangement composites (Carousel,
# Checkbox, Dropdown, List, Pagination, Popover, RadioGroup, SegmentedControl,
# Tabs, Toggle). The examples that demo them declare it as a required-feature, so a plain
# `cargo run --example ...` only sees the unconditional surface.
composite-extras = ["foliage_proper/composite-extras"]

[[example]]
name = "carousel"
required-features = ["composite-extras"]

[[example]]
name = "controls"
required-features = ["composite-extras"]

[[example]]
name = "dropdown_and_pagination"
required-features = ["composite-extras"]

[[example]]
name = "popover"
required-features = ["composite-extras"]

[[example]]
name = "tabs"
required-features = ["composite-extras"]