[package]
name = "foliage"
version = "1.0.0"
edition = "2024"
description = "Cross-platform, ECS-backed UI -- native, web, and Android from one Rust codebase."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eblack-leaf/foliage"
homepage = "https://eblack-leaf.github.io/foliage/"
documentation = "https://eblack-leaf.github.io/foliage/book/"

[features]
# Fetching an [`Origin::url`] off the web. Opt-in because it brings an http client and a TLS stack
# with it, and an app that bundles its assets or reads them from a path needs neither. On the web
# it selects nothing: a URL is fetched there by the browser, whatever this says.
origin-url = ["dep:ureq"]

[dependencies]
bevy_ecs = "0.19.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
fontdue = "0.9.4"
# PNG and JPEG only. A picture is given to the engine encoded and comes back as RGBA, so what
# `Fit` and the sheet work in is one thing however it arrived.
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }
tracing = "0.1.41"
# `std::time::Instant` panics on wasm. This is std's own on every other target, so the frame
# reads one clock everywhere.
web-time = "1.1.0"
wgpu = { version = "30.0.0", features = ["metal", "webgl", "wgsl"] }
winit = "0.30.13"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# A URL handed to the host, which is what `navigate` means where there is no page to replace. On
# Android this is an `ACTION_VIEW` intent rather than a desktop's opener, which is the same request.
open = "5.4.3"
pollster = "1.0.1"
# What `origin-url` fetches with. Blocking, because a retrieval is already on a thread of its own --
# an async client would bring a runtime to do what the `spawn` around a path read already does.
# Default features are rustls carrying its own roots, so what a fetch trusts travels with the binary
# rather than with the host, which is the same answer on a desktop and on Android.
ureq = { version = "3.3.0", optional = true }

[target.'cfg(all(not(target_family = "wasm"), not(target_os = "android")))'.dependencies]
# The system clipboard. `image-data` is off because a clipboard holds text here and nothing else,
# and `wayland-data-control` is on because a window on Wayland has no X11 selection to read.
#
# Android is excluded because arboard compiles no backend for it. What answers a paste there is the
# engine's own mirror, which is what `clipboard` already falls back to wherever a host will not
# serve one.
arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
] }

[target.'cfg(target_os = "android")'.dependencies]
# Only the feature differs from the dependency above. `android-game-activity` selects the backend
# that `androidx.games:games-activity` is the Java half of, and pulling the glue in through winit --
# rather than depending on `android-activity` directly -- is what keeps the two at one version: a
# mismatch between the glue winit calls and the glue the entry point defines is a link error at
# launch rather than a build failure here.
winit = { version = "0.30.13", features = ["android-game-activity"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3.103"
wasm-bindgen = "0.2.103"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "Clipboard",
    "ClipboardEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "Navigator",
    "Node",
    "Response",
    "Window",
] }

[dev-dependencies]
# `env-filter` so an example honours `RUST_LOG`, which is what turns the engine's per-phase trace
# spans on without rebuilding.
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
