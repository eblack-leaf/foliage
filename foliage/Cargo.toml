[package]
name = "foliage"
version = "1.0.0"
edition = "2024"
description = "Cross-platform, ECS-backed UI -- native, web, and Android from one Rust codebase."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eblack-leaf/foliage"
homepage = "https://eblack-leaf.github.io/foliage/"
documentation = "https://eblack-leaf.github.io/foliage/book/"

[dependencies]
bevy_ecs = "0.19.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
fontdue = "0.9.4"
# PNG and JPEG only. A picture is given to the engine encoded and comes back as RGBA, so what
# `Fit` and the sheet work in is one thing however it arrived.
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }
tracing = "0.1.41"
# `std::time::Instant` panics on wasm. This is std's own on every other target, so the frame
# reads one clock everywhere.
web-time = "1.1.0"
wgpu = { version = "30.0.0", features = ["metal", "webgl", "wgsl"] }
winit = "0.30.13"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The system clipboard. `image-data` is off because a clipboard holds text here and nothing else,
# and `wayland-data-control` is on because a window on Wayland has no X11 selection to read.
arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
] }
# A URL handed to the desktop, which is what `navigate` means where there is no page to replace.
open = "5.4.3"
pollster = "1.0.1"

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3.103"
wasm-bindgen = "0.2.103"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "Clipboard",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "Navigator",
    "Node",
    "Response",
    "Window",
] }

[dev-dependencies]
tracing-subscriber = "0.3.19"
