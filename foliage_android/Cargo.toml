[package]
name = "foliage_android"
version = "1.0.0"
edition = "2024"
description = "Scaffolds a minimal GameActivity + Gradle Android project around a foliage app's compiled cdylib"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eblack-leaf/foliage"
homepage = "https://eblack-leaf.github.io/foliage/"
documentation = "https://eblack-leaf.github.io/foliage/book/"

[[bin]]
name = "foliage_android"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "blocking"] }
