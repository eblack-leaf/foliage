[package]
name = "foliage_macros"
version = "1.0.0"
edition = "2024"
description = "Proc-macro support for foliage: #[component], #[targeted_event], #[query_data], #[resource], #[system_set], #[icon_handle]."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eblack-leaf/foliage"
homepage = "https://eblack-leaf.github.io/foliage/"
documentation = "https://eblack-leaf.github.io/foliage/book/"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.68", features = ["full"] }
quote = "1.0.35"
proc-macro-crate = "3.1.0"
proc-macro2 = "1.0.78"
