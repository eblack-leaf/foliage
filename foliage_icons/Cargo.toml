[package]
name = "foliage_icons"
version = "1.0.0"
edition = "2024"
description = "SVG -> foliage .icon MSDF format generator, plus registration codegen"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eblack-leaf/foliage"
homepage = "https://eblack-leaf.github.io/foliage/"
documentation = "https://eblack-leaf.github.io/foliage/book/"

[[bin]]
name = "foliage_icons"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
# usvg parses SVG into vector paths (+ re-exports tiny_skia_path for stroke outlining); no
# raster renderer (resvg/tiny-skia) is needed anymore -- MSDF works from the vector geometry.
usvg = "0.47.0"
# fdsm: pure-Rust multi-channel signed distance field generation (Chlumsky's thesis).
fdsm = "0.8"
nalgebra = "0.34"
image = "0.25"
i_overlay = "7.0.2"
