[package]
name = "foliage_proper"
version = "1.0.0"
edition = "2024"
description = "The foliage UI engine: bevy_ecs component model, wgpu rendering backend, and composite widget library."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eblack-leaf/foliage"
homepage = "https://eblack-leaf.github.io/foliage/"
documentation = "https://eblack-leaf.github.io/foliage/book/"
# a 760KB proportional font used only by the `#[cfg(test)]` check that `Foliage::font`
# rejects non-monospace input -- no reason for every download to carry it. Tests still see
# it locally; only the published tarball drops it.
exclude = ["src/text/test_fonts/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
foliage_macros = { path = "../foliage_macros" }
bytemuck = { version = "1.21.0", features = ["derive"] }
winit = { version = "0.30.13", features = ["android-game-activity"] }
wgpu = { version = "30.0.0", features = ["metal", "webgl", "wgsl"] }
bevy_ecs = "0.19.0"
bevy_color = "0.19.0"
serde = { version = "1.0.214", features = ["derive"] }
cfg-if = "1.0.0"
image = "0.25.4"
bitflags = "2.6.0"
futures-channel = "0.3.31"
uuid = { version = "1.11.0", features = ["v4", "js"] }
fontdue = "0.9.2"
smallvec = "1.13.2"
tracing-subscriber = "0.3.18"
tracing = "0.1.40"
wasm-bindgen = "0.2.126"
web-time = "1.1.0"
[dependencies.web-sys]
package = "web-sys"
version = "0.3.103"
features = [
    "Blob",
    "BlobPropertyBag",
    "console",
    "Clipboard",
    "ClipboardItem",
    "CssStyleDeclaration",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Navigator",
    "Window",
    "Document"
]
[features]
default = ["remote-assets"]
# native's half of `AssetSource::Url` -- an app that only ever loads bundled `Bytes` assets
# can drop this to shed reqwest/rustls entirely. wasm's own fetch path is unconditional (it's
# how bundled assets load there at all, not an optional extra), so this only affects native.
remote-assets = ["dep:reqwest"]
# Composites whose hard part is arrangement and appearance rather than behavior --
# Carousel, Checkbox, Dropdown, List, Pagination, Polyline, Popover, RadioGroup,
# SegmentedControl, Tabs, Toggle. Off by default: an unstyled one of these is rarely a
# head start over building the shape you actually want, so they stay available without
# being part of the surface every dependent carries. The behavioral composites
# (Button, Card, Router, Slider, TextInput) are unconditional.
composite-extras = []

# The tests that exercise the gated composites, skipped unless the feature is on -- same
# arrangement `foliage`'s own examples use. Without these, `cargo test --workspace` (what
# CI runs) fails to compile them against the default feature set.
[[test]]
name = "carousel"
required-features = ["composite-extras"]

[[test]]
name = "checkbox"
required-features = ["composite-extras"]

[[test]]
name = "composites"
required-features = ["composite-extras"]

[[test]]
name = "dropdown"
required-features = ["composite-extras"]

[[test]]
name = "pagination"
required-features = ["composite-extras"]

[[test]]
name = "popover"
required-features = ["composite-extras"]

[[test]]
name = "segmented_control"
required-features = ["composite-extras"]

[[test]]
name = "tabs"
required-features = ["composite-extras"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "1.0.1"
copypasta = "0.10.1"
open = "5.3.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "blocking"], optional = true }
[target.'cfg(target_family = "wasm")'.dependencies]
tracing-subscriber-wasm = "0.1.0"
wasm-bindgen-futures = "0.4.76"
console_error_panic_hook = "0.1.7"
console = "0.16.4"
flate2 = "1.0.34"
reqwest = "0.13.4"
