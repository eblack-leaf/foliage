[package]
name = "foliage-icons"
version = "1.0.0"
edition = "2024"
description = "Bakes an SVG into the distance field foliage draws a mark from, and generates the set that registers them."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eblack-leaf/foliage"
homepage = "https://eblack-leaf.github.io/foliage/"
documentation = "https://eblack-leaf.github.io/foliage/api/foliage_icons/"

[features]
default = ["cli"]
# The command-line tool. Off for a dependent that drives the baker itself and wants none of clap.
cli = ["dep:clap"]

[[bin]]
name = "foliage-icons"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"], optional = true }
# fdsm generates the multi-channel field; nalgebra is the transform it is stated in.
fdsm = "0.8"
nalgebra = "0.34"
# Boolean union over the flattened contours, which is what keeps overlapping strokes from
# painting a seam into the field.
i_overlay = "7.0.2"
# The float field the generator fills, and PNG for a preview. Matches what foliage asks of it,
# so a workspace build unifies on one set of codecs.
image = { version = "0.25.8", default-features = false, features = ["png"] }
# Parses SVG into vector paths and re-exports the path type strokes are outlined with. No
# raster renderer: a distance field is generated from the geometry rather than from pixels.
usvg = "0.47.0"
