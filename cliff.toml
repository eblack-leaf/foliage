[changelog]
header = """
# Changelog

All notable changes to foliage's public API. Versions before 1.0.0 were never published
and are not covered.
"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# drops anything not matching the format -- the pre-1.0 history never appears
filter_unconventional = true
tag_pattern = "v[0-9]*"

# skips first: order decides which parser claims a commit
[[git.commit_parsers]]
scope = "app"
skip = true
[[git.commit_parsers]]
scope = "site"
skip = true
[[git.commit_parsers]]
message = "^chore"
skip = true

[[git.commit_parsers]]
message = "^feat"
group = "Added"
[[git.commit_parsers]]
message = "^fix"
group = "Fixed"
[[git.commit_parsers]]
message = "^perf"
group = "Performance"
[[git.commit_parsers]]
message = "^refactor"
group = "Changed"
[[git.commit_parsers]]
message = "^docs"
group = "Documentation"
